{% extends 'base.html' %}{% block titulo %}Novo cliente{% endblock %}{% block conteudo %}
<div class="cabecalho"><div><div class="sobretitulo">CLIENTES / NOVO CADASTRO</div><h1>Cadastrar cliente</h1><p>Preencha os dados abaixo para adicionar um novo cliente.</p></div></div>
<div class="painel formulario"><h2>Informações do cliente</h2><p>Todos os campos são obrigatórios.</p><form method="post" action="{{ url_for('cadastro') }}"><label for="nome">Nome completo</label><input id="nome" name="nome" maxlength="100" required placeholder="Ex.: João da Silva" value="{{ cliente.get('nome','') }}"><label for="email">E-mail</label><input id="email" name="email" type="email" maxlength="150" required placeholder="Ex.: joao@email.com" value="{{ cliente.get('email','') }}"><label for="telefone">Telefone</label><input id="telefone" name="telefone" maxlength="30" required placeholder="Ex.: (51) 99999-9999" value="{{ cliente.get('telefone','') }}"><div class="acoes"><a class="botao secundario" href="{{ url_for('consulta') }}">Cancelar</a><button class="botao" type="submit">Salvar cliente</button></div></form></div>
{% endblock %}
